[package]
name = "dialogue"
version = "0.1.0"
description = "Dialogue - a relationship-first AI companion"
authors = ["Dialogue"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dialogue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.3.3"
reqwest = { version = "0.13.3", features = ["json"] }
tokio = { version = "1.52.3", features = ["time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
